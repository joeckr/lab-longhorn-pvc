name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@1c6283577ea8eabcda150cb4f2a9749b3c610b1d  # v1.24.1

  helm:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@1c6283577ea8eabcda150cb4f2a9749b3c610b1d  # v1.24.1
    with:
      charts-dir: 'chart'
      helm-repos: |
        longhorn https://charts.longhorn.io
