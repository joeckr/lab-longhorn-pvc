name: Lint Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/actionlint.yml@697db8faa5f8d3fa5ec15ef35674aa1e855d3a33  # v1.23.1
  commitlint:
    permissions:
      contents: read
      pull-requests: read  # required to fetch PR metadata
    uses: joeckr/ci-templates/.github/workflows/commitlint.yml@697db8faa5f8d3fa5ec15ef35674aa1e855d3a33  # v1.23.1
  shellcheck:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/shellcheck.yml@697db8faa5f8d3fa5ec15ef35674aa1e855d3a33  # v1.23.1
