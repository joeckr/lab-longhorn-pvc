name: Lint Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/actionlint.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
  commitlint:
    permissions:
      contents: read
      pull-requests: read  # required to fetch PR metadata
    uses: joeckr/ci-templates/.github/workflows/commitlint.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
  shellcheck:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/shellcheck.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
