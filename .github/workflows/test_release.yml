name: TEST Release

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
    with:
      charts-dir: 'chart'
      dry-run: true
      helm-repos: |
        longhorn https://charts.longhorn.io
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
    with:
      dry-run: true
