name: Dependabot Auto-Merge

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] -- no PR checkout; gated to Dependabot

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.id == 49699333
    permissions:
      contents: write
      pull-requests: write
      checks: read
    uses: joeckr/ci-templates/.github/workflows/dependabot-auto-merge.yml@697db8faa5f8d3fa5ec15ef35674aa1e855d3a33  # v1.23.1
