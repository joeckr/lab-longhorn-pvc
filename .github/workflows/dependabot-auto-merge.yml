name: Dependabot Auto-Merge

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] -- no PR checkout; gated to Dependabot

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.id == 49699333
    permissions:
      contents: write
      pull-requests: write
      checks: read
    uses: joeckr/ci-templates/.github/workflows/dependabot-auto-merge.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
