[tools]
betterleaks = "latest"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "v1.7.1"
shellcheck = "latest"
zizmor = "latest"
hk = "latest"
pkl = "latest"
tombi = "latest"
yamllint = "latest"

[tasks.install]
description = "Install tools, hook up hooks, configure repo settings, and prepare environment"
depends = ["repo-settings"]
run = """
hk install --mise
"""

[tasks.repo-settings]
description = "Configure GitHub repository settings and default-branch protection ruleset"
run = """
if command -v gh >/dev/null 2>&1 && git remote get-url origin >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
  gh repo edit --delete-branch-on-merge --enable-auto-merge || true
  payload='{"name":"Protect default branch","target":"branch","enforcement":"active","conditions":{"ref_name":{"include":["~DEFAULT_BRANCH"],"exclude":[]}},"rules":[{"type":"deletion"},{"type":"non_fast_forward"}]}'
  ruleset_id="$(gh api 'repos/{owner}/{repo}/rulesets' --jq '.[] | select(.name == "Protect default branch") | .id' 2>/dev/null | head -n1 || true)"
  if [ -n "$ruleset_id" ]; then
    printf '%s' "$payload" | gh api -X PUT "repos/{owner}/{repo}/rulesets/$ruleset_id" --input - >/dev/null 2>&1 || true
  else
    printf '%s' "$payload" | gh api -X POST 'repos/{owner}/{repo}/rulesets' --input - >/dev/null 2>&1 || true
  fi
fi
"""

[tasks.hk]
description = "Run hk checks on all files"
alias = "check"
run = """
hk check --all
"""

[tasks.helm-d]
description = "Build Helm chart dependencies"
run = """
helm repo add longhorn https://charts.longhorn.io --force-update
helm dependency build chart/
"""

[tasks.helm-up]
description = "Update Helm chart dependencies and Chart.lock"
run = """
helm repo add longhorn https://charts.longhorn.io --force-update
helm dependency update chart/
"""

[tasks.helm-l]
description = "Lint Helm chart"
depends = ["helm-d"]
run = """
helm lint chart/
"""

[tasks.helm-t]
description = "Render Helm chart templates to rendered.yaml"
depends = ["helm-d"]
run = """
helm template longhorn chart/ --namespace longhorn-system > rendered.yaml
"""

[tasks.helm-ns]
description = "Apply privileged Pod Security Standard namespace for Longhorn"
run = """
kubectl apply -f manifests/namespace.yaml
"""

[tasks.helm-i]
description = "Install or upgrade Longhorn Helm chart in longhorn-system"
depends = ["helm-d", "helm-ns"]
run = """
helm upgrade --install longhorn chart/ --namespace longhorn-system
"""

[tasks.helm-u]
description = "Uninstall Longhorn Helm chart from longhorn-system"
run = """
kubectl -n longhorn-system patch settings.longhorn.io deleting-confirmation-flag --type=merge -p '{"value":"true"}' || true
helm uninstall longhorn --namespace longhorn-system
"""

[tasks.ui]
description = "Port-forward Longhorn UI to http://localhost:8080"
run = """
kubectl -n longhorn-system port-forward svc/longhorn-frontend 8080:80
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""
